# Depot CI Migration
# Source: .github/workflows/secret-demo.yaml
#
# Changes made:
# - Changed GitHub runs-on labels to their Depot equivalents

name: secret-demo

on:
  push:

jobs:
  secret-demo:
    name: Print secret length
    runs-on: depot-ubuntu-latest #was: ubuntu-latest. Mapped standard GitHub runner to Depot equivalent.
    timeout-minutes: 5
    steps:
      - name: Print secret length
        env:
          MIGRATION_DEMO_SECRET: ${{ secrets.MIGRATION_DEMO_SECRET }}
        run: |
          if [ -z "${MIGRATION_DEMO_SECRET:-}" ]; then
            echo "::error::MIGRATION_DEMO_SECRET is not configured"
            exit 1
          fi

          echo "MIGRATION_DEMO_SECRET was injected successfully."
          echo "Secret length: ${#MIGRATION_DEMO_SECRET}"
